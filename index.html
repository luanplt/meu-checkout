<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 24px 15px;
      background: #f5f5f5;
      color: #222;
      font-family: Arial, sans-serif;
    }
    .container {
      max-width: 440px;
      margin: 30px auto;
      padding: 25px;
      background: white;
      border-radius: 14px;
      box-shadow: 0 3px 18px #00000012;
    }
    h1 { text-align: center; font-size: 25px; }
    .produto { text-align: center; margin: 25px 0; }
    #preco { font-size: 30px; font-weight: bold; }
    label { display: block; margin: 14px 0 6px; }
    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }
    button {
      width: 100%;
      padding: 15px;
      margin-top: 20px;
      border: 0;
      border-radius: 8px;
      background: #171717;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }
    button:disabled { opacity: .6; }
    #resultado {
      margin-top: 22px;
      text-align: center;
      overflow-wrap: anywhere;
    }
    #qrcode { max-width: 230px; width: 100%; margin: 15px auto; }
    #codigoPix {
      padding: 12px;
      background: #f1f1f1;
      border-radius: 8px;
      font-size: 13px;
      overflow-wrap: anywhere;
    }
    .aviso { color: #666; font-size: 13px; text-align: center; }
    .erro { color: #c62828; }
  </style>
</head>
<body>
  <main class="container">
    <h1 id="nomeProduto">Carregando produto...</h1>

    <div class="produto">
      <div id="preco">...</div>
      <p>Pagamento via Pix</p>
    </div>

    <form id="formulario">
      <label for="nome">Nome completo</label>
      <input id="nome" required autocomplete="name">

      <label for="email">E-mail</label>
      <input id="email" type="email" required autocomplete="email">

      <label for="cpf">CPF</label>
      <input id="cpf" required inputmode="numeric" maxlength="14"
        placeholder="000.000.000-00">

      <label for="telefone">Celular</label>
      <input id="telefone" required inputmode="tel"
        autocomplete="tel" placeholder="(00) 00000-0000">

      <button id="botao" type="submit">Gerar Pix</button>
    </form>

    <div id="resultado"></div>
    <p class="aviso">Após a confirmação do pagamento, o acesso será liberado conforme as regras do produto.</p>
  </main>

  <script>
    const resultado = document.getElementById("resultado");
    const botao = document.getElementById("botao");

    async function carregarProduto() {
      try {
        const resposta = await fetch("/api/produto");
        const dados = await resposta.json();

        if (!resposta.ok || dados.erro) {
          throw new Error(dados.erro || "Não foi possível carregar o produto.");
        }

        document.getElementById("nomeProduto").textContent =
          dados.nome || dados.product_name || "Meu Produto";

        const valor = Number(dados.preco ?? dados.price);
        if (!Number.isFinite(valor)) throw new Error("Preço do produto inválido.");

        document.getElementById("preco").textContent =
          valor.toLocaleString("pt-BR", {
            style: "currency", currency: "BRL"
          });
      } catch (erro) {
        document.getElementById("nomeProduto").textContent = "Erro ao carregar";
        document.getElementById("preco").textContent = "";
        resultado.textContent = erro.message;
        resultado.className = "erro";
      }
    }

    document.getElementById("formulario").addEventListener("submit", async (evento) => {
      evento.preventDefault();
      resultado.textContent = "";
      botao.disabled = true;
      botao.textContent = "Gerando Pix...";

      const dados = {
        nome: document.getElementById("nome").value.trim(),
        email: document.getElementById("email").value.trim(),
        cpf: document.getElementById("cpf").value.replace(/\D/g, ""),
        telefone: document.getElementById("telefone").value.replace(/\D/g, "")
      };

      try {
        const resposta = await fetch("/api/pix/criar", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(dados)
        });

        const retorno = await resposta.json();

        if (!resposta.ok || retorno.erro || retorno.status === "erro") {
          throw new Error(retorno.mensagem || retorno.erro || "Não foi possível gerar o Pix.");
        }

        const pix = retorno.pix || retorno;
        const imagem = pix.imagemQrcode || pix.imagem_qrcode ||
          pix.qrCodeImage || pix.qrcode_image;
        const codigo = pix.qrcode || pix.codigoPix || pix.copiaECola ||
          pix.pixCopiaECola || pix.copia_cola;

        resultado.innerHTML = "<h3>Pix gerado!</h3>";

        if (imagem) {
          const img = document.createElement("img");
          img.id = "qrcode";
          img.alt = "QR Code Pix";
          img.src = imagem.startsWith("data:") || imagem.startsWith("http")
            ? imagem : "data:image/png;base64," + imagem;
          resultado.appendChild(img);
        }

        if (codigo) {
          const titulo = document.createElement("p");
          titulo.textContent = "Pix Copia e Cola:";
          resultado.appendChild(titulo);

          const texto = document.createElement("div");
          texto.id = "codigoPix";
          texto.textContent = codigo;
          resultado.appendChild(texto);

          const copiar = document.createElement("button");
          copiar.type = "button";
          copiar.textContent = "Copiar código Pix";
          copiar.onclick = async () => {
            await navigator.clipboard.writeText(codigo);
            copiar.textContent = "Código copiado!";
          };
          resultado.appendChild(copiar);
        }

        if (!imagem && !codigo) {
          resultado.textContent = JSON.stringify(retorno);
        }
      } catch (erro) {
        resultado.textContent = erro.message;
        resultado.className = "erro";
      } finally {
        botao.disabled = false;
        botao.textContent = "Gerar Pix";
      }
    });

    carregarProduto();
  </script>
</body>
</html>
